name: Build and Release

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example v1.5.0)"
        required: true
      latest:
        description: "Move latest and the major channel to this tag (only for the newest release)"
        required: false
        default: "false"

env:
  REGISTRY: git.chaops.de
  OWNER: seriesofsystems
  REGISTRY_USER: rwxd
  IMAGE: seriesofsystems
  RETENTION_DAYS: "14"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: https://github.com/actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Typecheck, test and build
        run: npm run check

  container:
    needs: test
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: tcp://git.chaops.de:2375
      DOCKER_BUILDKIT: "0"
    steps:
      - uses: https://github.com/actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: https://github.com/actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Compute image tags
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_LATEST: ${{ github.event.inputs.latest }}
        run: |
          image="${REGISTRY}/${OWNER}/${IMAGE}"
          short="$(git rev-parse --short=12 HEAD)"
          tags=("${image}:sha-${short}")
          version="sha-${short}"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="$(jq -r '.inputs.tag // empty' "${GITHUB_EVENT_PATH}" 2>/dev/null || true)"
            if [[ -z "${tag}" ]]; then
              tag="${INPUT_TAG:-}"
            fi
            latest="$(jq -r '.inputs.latest // empty' "${GITHUB_EVENT_PATH}" 2>/dev/null || true)"
            if [[ -z "${latest}" ]]; then
              latest="${INPUT_LATEST:-false}"
            fi
            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "workflow_dispatch requires a release tag like v1.2.3, got '${tag}'" >&2
              exit 1
            fi
            tags+=("${image}:${tag}")
            if [[ "${latest}" == "true" ]]; then
              major="${tag%%.*}"
              tags+=("${image}:${major}" "${image}:latest")
            fi
            version="${tag}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            tags+=("${image}:main" "${image}:latest")
            version="main-${short}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            major="${tag%%.*}"
            tags+=("${image}:${tag}" "${image}:${major}" "${image}:latest")
            version="${tag}"
          else
            echo "Unsupported ref for container build: ${GITHUB_REF}" >&2
            exit 1
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "amd64=${image}:build-amd64-${short}" >> "$GITHUB_OUTPUT"
          echo "arm64=${image}:build-arm64-${short}" >> "$GITHUB_OUTPUT"

      - name: Log in to Forgejo registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build and push per-architecture images
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          AMD64_IMAGE: ${{ steps.meta.outputs.amd64 }}
          ARM64_IMAGE: ${{ steps.meta.outputs.arm64 }}
        run: |
          labels=(
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.version=${VERSION}"
          )

          docker build --platform linux/amd64 --build-arg VERSION="${VERSION}" "${labels[@]}" \
            -f Dockerfile.release -t "$AMD64_IMAGE" .
          docker build --platform linux/arm64 --build-arg VERSION="${VERSION}" "${labels[@]}" \
            -f Dockerfile.release -t "$ARM64_IMAGE" .

          docker push "$AMD64_IMAGE"
          docker push "$ARM64_IMAGE"

      - name: Publish multi-architecture manifests
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          AMD64_IMAGE: ${{ steps.meta.outputs.amd64 }}
          ARM64_IMAGE: ${{ steps.meta.outputs.arm64 }}
        run: |
          mapfile -t tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            docker manifest create --amend "$tag" "$AMD64_IMAGE" "$ARM64_IMAGE"
            docker manifest push --purge "$tag"
          done

  prune:
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Prune old image tags
        run: ./scripts/prune-forgejo-packages.sh
        env:
          FORGEJO_URL: ${{ github.server_url }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ env.OWNER }}
          IMAGE: ${{ env.IMAGE }}
          RETENTION_DAYS: ${{ env.RETENTION_DAYS }}

  semantic-release:
    needs: [test, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run semantic-release
        uses: https://${{ secrets.RELEASE_TOKEN }}@git.chaops.de/rwxd/forgejo-actions/semantic-release@main
        with:
          gitea_token: ${{ secrets.RELEASE_TOKEN }}
          gitea_url: ${{ github.server_url }}

      - name: Dispatch versioned image build
        if: success()
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tag="$(curl --fail --silent --show-error \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${FORGEJO_URL%/}/api/v1/repos/${REPO}/tags?limit=50" \
            | jq -r --arg sha "${SHA}" '.[] | select(.commit.sha == $sha) | .name' \
            | head -n1)"
          if [[ -z "$tag" ]]; then
            echo "No release tag points at ${SHA}; skipping versioned image build."
            exit 0
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag '${tag}'; refusing to dispatch." >&2
            exit 1
          fi
          echo "Dispatching versioned image build for ${tag}"
          curl --fail --silent --show-error \
            -X POST "${FORGEJO_URL%/}/api/v1/repos/${REPO}/actions/workflows/build.yaml/dispatches" \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(printf '{"ref":"main","inputs":{"tag":"%s","latest":"true"}}' "$tag")"
